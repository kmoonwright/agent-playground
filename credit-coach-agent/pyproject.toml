[project]
name = "credit-coach-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "arize",
    "arize-otel",
    "openinference-instrumentation",
    "openinference-instrumentation-openai",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "fastapi",
    "uvicorn",
    "pandas",
    "pydantic>=2.0",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
